kind: workflow
trigger:
  kind: OnConversationStart
  id: compliance_trigger
  actions:
    - kind: SetVariable
      id: store-original-input
      variable: Local.OriginalInput
      value: =System.LastMessage
    - kind: InvokeAzureAgent
      id: invoke-doc-consistency
      agent:
        name: DocumentConsistencyAgent
      input:
        messages: =Local.OriginalInput
      output:
        messages: Local.DocConsistencyResult
        autoSend: false
    - kind: InvokeAzureAgent
      id: invoke-hs-code
      agent:
        name: HSCodeValidationAgent
      input:
        messages: =Local.OriginalInput
      output:
        messages: Local.HSCodeResult
        autoSend: false
    - kind: InvokeAzureAgent
      id: invoke-country-restrictions
      agent:
        name: CountryRestrictionsAgent
      input:
        messages: =Local.OriginalInput
      output:
        messages: Local.SanctionsResult
        autoSend: false
    - kind: InvokeAzureAgent
      id: invoke-country-origin
      agent:
        name: CountryOfOriginAgent
      input:
        messages: =Local.OriginalInput
      output:
        messages: Local.OriginResult
        autoSend: false
    - kind: InvokeAzureAgent
      id: invoke-controlled-goods
      agent:
        name: ControlledGoodsAgent
      input:
        messages: =Local.OriginalInput
      output:
        messages: Local.ControlledResult
        autoSend: false
    - kind: InvokeAzureAgent
      id: invoke-value-reasonableness
      agent:
        name: ValueReasonablenessAgent
      input:
        messages: =Local.OriginalInput
      output:
        messages: Local.ValueResult
        autoSend: false
    - kind: InvokeAzureAgent
      id: invoke-shipper-verification
      agent:
        name: ShipperVerificationAgent
      input:
        messages: =Local.OriginalInput
      output:
        messages: Local.ShipperResult
        autoSend: false
    - kind: SetVariable
      id: build-handoff-packet
      variable: Local.HandoffPacket
      value: |
        You are the ComplianceAggregatorAgent. Aggregate ALL of the following agent findings into a SINGLE unified ComplianceReport JSON object. Do NOT echo individual agent outputs. Respond with ONLY the JSON object, no markdown fences, no commentary.

        ORIGINAL DECLARATION:
        ${Local.OriginalInput}

        === SPECIALIST AGENT FINDINGS ===

        1. DocumentConsistencyAgent:
        ${Local.DocConsistencyResult}

        2. HSCodeValidationAgent:
        ${Local.HSCodeResult}

        3. CountryRestrictionsAgent:
        ${Local.SanctionsResult}

        4. CountryOfOriginAgent:
        ${Local.OriginResult}

        5. ControlledGoodsAgent:
        ${Local.ControlledResult}

        6. ValueReasonablenessAgent:
        ${Local.ValueResult}

        7. ShipperVerificationAgent:
        ${Local.ShipperResult}

        === END FINDINGS ===

        Merge all findings into a single ComplianceReport JSON with: declaration_id, timestamp, overall_risk, requires_manual_review, summary, findings[], counts, recommendations[], agents_reporting, processing_notes.
    - kind: InvokeAzureAgent
      id: invoke-aggregator
      agent:
        name: ComplianceAggregatorAgent
      conversationId: =System.ConversationId
      input:
        messages: =Local.HandoffPacket
      output:
        messages: Local.AggregatedReport
        autoSend: true
    - kind: EndConversation
      id: end-conversation
id: customs-compliance-workflow-v1
name: customs-compliance-workflow
description: |
  Sequential customs compliance analysis workflow for Foundry server-side execution.
  Runs 7 specialized agents to analyze customs declarations for compliance issues,
  then aggregates all findings into a single report.
  Note: Foundry server-side does not support 'kind: Parallel'.
  For parallel execution, use WORKFLOW_MODE=sdk (code-based orchestration).
